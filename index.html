<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach</title>
<meta name="theme-color" content="#0b0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  /* Committed dark athletic theme — electric blue. One look, both OS modes. */
  :root {
    --volt: #00c8ff;           /* chrome accent: buttons, labels, highlights */
    --volt-soft: rgba(0,200,255,.1);
    --bar: #0aa2d6;            /* chart marks — validated vs dark surface */
    --bg: #0b0d0f;
    --surface: #13161a;
    --surface-2: #1a1e23;
    --ink: #f1f4f6;
    --ink-2: #98a2aa;
    --ink-3: #5e6870;
    --line: rgba(241,244,246,.08);
    --good: #2bd58a; --warn: #f0a13c; --bad: #f0574f;
    --headline: "HelveticaNeue-CondensedBlack", "Helvetica Neue Condensed",
      "AvenirNextCondensed-Bold", "Arial Narrow", -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(90% 42% at 75% -5%, rgba(0,200,255,.22), transparent 65%),
      radial-gradient(70% 30% at 10% 30%, rgba(0,200,255,.07), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  header.app {
    padding: calc(16px + env(safe-area-inset-top)) 20px 10px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  header.app h1 {
    font-family: var(--headline);
    font-size: clamp(2.7rem, 13vw, 3.6rem); font-weight: 900;
    text-transform: uppercase; letter-spacing: -0.015em; line-height: .92;
  }
  header.app h1 .tick { color: var(--volt); }
  header.app .sub {
    color: var(--ink-2); font-size: .76rem; margin-top: 8px;
    text-transform: uppercase; letter-spacing: .16em; font-weight: 700;
  }
  main { padding: 8px 16px 24px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; padding: 18px; margin-bottom: 12px;
  }
  /* Liquid glass: frosted translucent surfaces with a specular top edge.
     Solid-surface fallback stays above for browsers without backdrop-filter. */
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .card, .tile {
      background:
        linear-gradient(125deg, rgba(255,255,255,.06), rgba(255,255,255,0) 45%),
        rgba(20,26,31,.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      backdrop-filter: blur(22px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 10px 30px rgba(0,0,0,.3);
    }
    .wknav button {
      background: rgba(255,255,255,.06);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
    }
  }
  @media (prefers-reduced-transparency: reduce) {
    .card, .tile, nav.tabs, .wknav button {
      -webkit-backdrop-filter: none; backdrop-filter: none;
      background: var(--surface);
    }
  }
  .card h3 {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .16em;
    color: var(--volt); margin-bottom: 12px; font-weight: 800;
  }
  .card h3::after { content: ""; display: block; width: 30px; height: 3px; background: var(--volt); margin-top: 6px; border-radius: 2px; }
  .wk-title {
    font-family: var(--headline);
    font-size: 1.9rem; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0; margin-bottom: 2px; line-height: .98;
  }
  .wk-meta { color: var(--ink-2); font-size: .85rem; margin: 4px 0 8px; font-weight: 600; }
  .wk-detail { font-size: .95rem; line-height: 1.55; color: var(--ink); }
  ul.plain { list-style: none; }
  ul.plain li { padding: 5px 0; font-size: .93rem; line-height: 1.5; display: flex; gap: 10px; }
  ul.plain li::before { content: "//"; color: var(--volt); font-weight: 800; flex-shrink: 0; }
  .badge {
    display: inline-block; font-size: .68rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: .08em; border-radius: 999px; padding: 4px 10px;
    vertical-align: 6px; margin-left: 10px;
  }
  .badge.upcoming { background: var(--volt-soft); color: var(--volt); }
  .badge.completed { background: rgba(43,213,138,.15); color: var(--good); }
  .badge.partial { background: rgba(240,161,60,.15); color: var(--warn); }
  .badge.skipped { background: rgba(240,87,79,.14); color: var(--bad); }
  .badge.rest { background: var(--line); color: var(--ink-2); }
  /* schedule — one tile per day */
  .day-row { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .day-card { padding: 6px 14px; margin-bottom: 10px; }
  .day-card.dim { opacity: .85; }
  .day-row .head { display: flex; align-items: center; gap: 12px; padding: 10px 2px; }
  .datechip {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    background: var(--volt-soft); color: var(--volt); font-weight: 900;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(0,200,255,.12);
  }
  .day-card.today .datechip {
    box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 2px 10px rgba(0,200,255,.35);
  }
  .datechip .d1 { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; }
  .datechip .d2 { font-family: var(--headline); font-size: 1.3rem; line-height: 1; }
  .day-card.dim .datechip { background: rgba(241,244,246,.07); color: var(--ink-2); }
  .day-card.today .datechip { background: var(--volt); color: #04121a; }
  .day-card.today.dim .datechip { background: var(--volt); color: #04121a; }
  .day-row .what { flex: 1; min-width: 0; }
  .day-row .what .t {
    font-family: var(--headline);
    font-weight: 900; font-size: 1.25rem; text-transform: uppercase; letter-spacing: .01em; line-height: 1;
  }
  .day-row .st { font-size: 1rem; width: 22px; text-align: center; flex-shrink: 0; font-weight: 800; }
  .day-row .chev {
    width: 24px; height: 24px; flex-shrink: 0; color: var(--volt);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  .day-row .chev svg { width: 24px; height: 24px; display: block; }
  .day-row.open .chev { transform: rotate(180deg); }
  .day-row .full {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .3s cubic-bezier(.4,0,.2,1);
    padding: 0 2px 0 60px;
  }
  .day-row .full .inner {
    overflow: hidden; min-height: 0; opacity: 0;
    transition: opacity .22s ease .04s;
  }
  .day-row.open .full { grid-template-rows: 1fr; }
  .day-row.open .full .inner { opacity: 1; }
  .day-row .full .txt { font-size: .92rem; line-height: 1.55; color: var(--ink); }
  .day-row .full .dmacros {
    display: inline-block; margin-top: 10px; padding: 5px 10px; border-radius: 8px;
    background: var(--volt-soft); color: var(--volt); font-size: .74rem; font-weight: 800;
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
  }
  .day-row .full .inner > .meta { padding-bottom: 14px; }
  @media (prefers-reduced-motion: reduce) {
    .day-row .full, .day-row .full .inner, .day-row .chev { transition: none; }
  }
  .day-row .full .meta { color: var(--ink-2); font-size: .8rem; margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .st.completed { color: var(--good); } .st.partial { color: var(--warn); }
  .st.skipped { color: var(--bad); } .st.upcoming { color: var(--ink-3); }
  .wknav {
    position: sticky; top: calc(env(safe-area-inset-top) + 8px); z-index: 15;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding: 8px 10px; border-radius: 999px;
    background: rgba(11,13,15,.6);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    backdrop-filter: blur(22px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 8px 24px rgba(0,0,0,.35);
  }
  .wknav button {
    background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--volt);
    border-radius: 999px; padding: 6px 16px; font-size: 1rem; font-weight: 900; cursor: pointer;
  }
  .wknav button:disabled { color: var(--ink-3); }
  .wkintro { padding: 16px 6px 24px; }
  .wksum { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .wkdiv { width: 1px; height: 40px; background: var(--line); margin: 0 8px; }
  .wkbar {
    height: 6px; border-radius: 3px; background: rgba(255,255,255,.08);
    margin-bottom: 12px; overflow: hidden;
  }
  .wkbar .fill {
    height: 100%; background: var(--volt); border-radius: 3px;
    box-shadow: 0 0 10px rgba(0,200,255,.45);
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }
  .wkintro .counts { color: var(--ink-2); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
  .wksum .minum {
    font-family: var(--headline); font-weight: 900; font-size: 2.7rem; line-height: 1;
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  }
  .wksum .milab { color: var(--volt); font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; line-height: 1.4; }
  .wksum-text { color: var(--ink-2); font-size: .9rem; line-height: 1.5; }
  .wknav .label {
    font-family: var(--headline);
    font-weight: 900; font-size: 1.15rem;
    text-transform: uppercase; letter-spacing: .03em;
  }
  /* progress */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .tile {
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px 14px 14px;
  }
  .tile .k {
    font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 800;
    color: var(--volt); margin-bottom: 10px;
  }
  .tile .k::after { content: ""; display: block; width: 26px; height: 3px; background: var(--volt); margin-top: 5px; border-radius: 2px; }
  .tile .v {
    font-family: var(--headline);
    font-size: 2.6rem; font-weight: 900; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; line-height: 1; color: var(--ink);
  }
  .tile .l { color: var(--ink-2); font-size: .68rem; margin-top: 6px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
  .chart { position: relative; height: 150px; display: flex; align-items: flex-end; gap: 2px; padding-top: 18px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
  .chart .bar { width: 100%; max-width: 40px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
  .chart .col .xl { font-size: .66rem; color: var(--ink-3); margin-top: 6px; }
  .chart .col .dl { font-size: .7rem; color: var(--ink-2); position: absolute; top: 0; font-variant-numeric: tabular-nums; font-weight: 700; }
  .chart .col .tip {
    display: none; position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: .72rem; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 2;
  }
  .chart .col:hover .tip, .chart .col:active .tip { display: block; }
  /* nutrition block */
  .macrorow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .macro {
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 4px; text-align: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
  }
  .macro .mk { font-size: .56rem; color: rgba(241,244,246,.52); text-transform: uppercase; letter-spacing: .1em; font-weight: 800; margin-bottom: 6px; }
  .macro .mv { font-family: var(--headline); font-weight: 900; font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .macro .mv.hit { color: var(--volt); }
  .macro .mv.over { color: var(--bad); }
  .macro .mbar i.over { background: var(--bad); }
  .macro .ml { font-size: .62rem; color: var(--ink-3); font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .macro .mbar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.09); margin-top: 8px; overflow: hidden; }
  .macro .mbar i { display: block; height: 100%; background: var(--volt); border-radius: 2px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .seclab {
    font-size: .62rem; text-transform: uppercase; letter-spacing: .14em;
    color: rgba(241,244,246,.52); font-weight: 800; margin-bottom: 6px;
  }
  .sectxt { font-size: .92rem; line-height: 1.5; color: var(--ink); }
  .cread { margin: 2px 0 14px; padding-top: 16px; }
  .cread .seclab { margin-bottom: 4px; }
  .cread.watch .seclab { color: var(--warn); }
  .cread.flag .seclab { color: var(--bad); }
  .daytag { color: var(--ink-2); font-weight: 700; letter-spacing: .1em; }
  .loglist li { flex-direction: column; gap: 0; }
  .loglist li::before { display: none; }
  .loglist .row1 { display: flex; justify-content: space-between; width: 100%; font-weight: 800; font-size: .9rem; text-transform: uppercase; }
  .loglist .row1 .dt { color: var(--ink-3); font-weight: 600; font-size: .78rem; }
  .loglist .row2 { color: var(--ink-2); font-size: .84rem; }
  /* weekly mileage line chart */
  .lread { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .lread .lrd { color: var(--ink-2); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
  .lread .lrv { font-family: var(--headline); font-weight: 900; font-size: 1.8rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .lread .lrv small { font-size: .95rem; color: var(--ink-2); font-weight: 700; }
  .lwrap { position: relative; height: 170px; touch-action: pan-y; cursor: crosshair; }
  .lwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lwrap .dot {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: var(--bar); box-shadow: 0 0 0 2px var(--surface);
    transform: translate(-50%, -50%); z-index: 2;
    transition: transform .12s ease, background .12s ease;
  }
  .lwrap .dot.active {
    background: var(--volt); transform: translate(-50%, -50%) scale(1.35);
    box-shadow: 0 0 0 2px var(--surface), 0 0 12px rgba(0,200,255,.55);
  }
  .lcursor {
    position: absolute; width: 2px; border-radius: 1px; display: none;
    background: rgba(241,244,246,.22); transform: translateX(-50%); z-index: 1;
  }
  .lwrap .yl { position: absolute; right: 0; transform: translateY(-50%); font-size: .64rem; color: var(--ink-3); font-weight: 700; }
  .lwrap .xl2 { position: absolute; bottom: 0; transform: translateX(-50%); font-size: .64rem; color: var(--ink-3); font-weight: 700; text-transform: uppercase; }
  /* tab bar */
  nav.tabs {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 16px; right: 90px; z-index: 10;
    display: flex; background: rgba(19,23,27,.55);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.35);
  }
  nav.tabs button {
    flex: 1; background: none; border: 0; padding: 10px 0 8px; cursor: pointer; border-radius: 999px;
    color: var(--ink-3); font-size: .6rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: .1em; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.tabs button.on { background: rgba(0,200,255,.12); }
  nav.tabs button.on { color: var(--volt); }
  nav.tabs svg { width: 22px; height: 22px; }
  /* FAB */
  .fab {
    position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 11;
    width: 60px; height: 60px; border-radius: 50%;
    background:
      radial-gradient(120% 90% at 30% 15%, rgba(255,255,255,.5), rgba(255,255,255,0) 48%),
      var(--volt);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 -6px 12px rgba(0,80,45,.25),
      0 0 0 1px rgba(0,200,255,.4), 0 6px 24px rgba(0,200,255,.35);
    text-decoration: none;
  }
  .fab:active { transform: scale(.94); }
  .fab svg { width: 32px; height: 32px; }
  .hidden { display: none !important; }
  /* pull-to-refresh */
  .ptr {
    position: fixed; top: calc(env(safe-area-inset-top) - 44px); left: 50%; z-index: 30;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(19,23,27,.85);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 6px 18px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, 0); opacity: 0; pointer-events: none;
    transition: opacity .15s;
  }
  .ptr.show { opacity: 1; }
  .ptr .arr { width: 20px; height: 20px; color: var(--ink-2); transition: transform .18s, color .18s; }
  .ptr.ready .arr { transform: rotate(180deg); color: var(--volt); }
  .ptr .spinner {
    display: none; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(0,200,255,.25); border-top-color: var(--volt);
    animation: ptrspin .7s linear infinite;
  }
  .ptr.spin .arr { display: none; }
  .ptr.spin .spinner { display: block; }
  @keyframes ptrspin { to { transform: rotate(360deg); } }
  .setup input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: .95rem; margin: 6px 0 12px;
  }
  .setup button.go {
    background: var(--volt); color: #04121a; border: 0; border-radius: 8px;
    padding: 11px 20px; font-weight: 900; font-size: .9rem; text-transform: uppercase;
    letter-spacing: .06em; cursor: pointer; transform: skewX(-6deg);
  }
  .muted { color: var(--ink-2); font-size: .86rem; line-height: 1.55; }
  .err { color: var(--bad); font-size: .86rem; }
  code { color: var(--volt); }
</style>
</head>
<body>

<header class="app">
  <div><h1 id="bigTitle">Today<span class="tick">.</span></h1><div class="sub" id="subtitle"></div></div>
</header>

<main>
  <div id="view-setup" class="hidden">
    <div class="card setup">
      <h3>Connect to your coach data</h3>
      <p class="muted">Couldn't load <code>coach-data/</code> from GitHub. If the repo is private,
      paste a fine-grained personal access token with read-only <b>Contents</b> access to
      <b id="repoName"></b>. It's stored only on this device.</p>
      <input id="tokenInput" type="password" placeholder="github_pat_…" autocomplete="off">
      <label class="muted">Branch</label>
      <input id="branchInput" type="text" placeholder="main">
      <button class="go" id="saveSetup">Save & reload</button>
      <p class="err" id="setupErr"></p>
    </div>
  </div>
  <div id="view-brief"></div>
  <div id="view-schedule" class="hidden"></div>
  <div id="view-progress" class="hidden"></div>
</main>

<div class="ptr" id="ptr" aria-hidden="true">
  <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14M6 12l6 6 6-6"/></svg>
  <div class="spinner"></div>
</div>

<a class="fab" id="fab" href="https://claude.ai/code" target="_blank" rel="noopener" aria-label="Talk to Coach">
  <svg viewBox="0 0 512 512" fill="none" aria-hidden="true">
    <circle cx="225" cy="305" r="118" fill="#04121a"/>
    <rect x="225" y="196" width="223" height="66" rx="22" fill="#04121a"/>
    <circle cx="225" cy="305" r="46" fill="#00c8ff"/>
  </svg>
</a>

<nav class="tabs">
  <button data-tab="brief" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Brief
  </button>
  <button data-tab="schedule">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Schedule
  </button>
  <button data-tab="progress">

    Progress

<script>
const OWNER = 'cdunn444', REPO = 'Coach';
const DEFAULT_BRANCHES = ['main', 'claude/skill-from-prd-skh9jj'];
const LS = { token: 'coach_gh_token', branch: 'coach_gh_branch' };
const $ = id => document.getElementById(id);
document.getElementById('repoName').textContent = OWNER + '/' + REPO;

/* ---------- data loading ---------- */
async function ghFetch(path, branch, token) {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`;
  const headers = { 'Accept': 'application/vnd.github.raw+json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(url, { headers, signal: AbortSignal.timeout(4000) });
  if (!r.ok) throw new Error(r.status);
  return r.text();
}
async function localFetch(path) {
  const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store', signal: AbortSignal.timeout(4000) });
  if (!r.ok) throw new Error(r.status);
  return r.text();
}
async function loadFile(path) {
  const token = localStorage.getItem(LS.token) || '';
  const saved = localStorage.getItem(LS.branch);
  const branches = saved ? [saved] : DEFAULT_BRANCHES;
  for (const b of branches) {
    try { return await ghFetch(path, b, token); } catch (e) { /* next */ }
  }
  return await localFetch(path); // same-origin GitHub Pages copy (may lag a deploy)
}
const parseJSONL = t => t.split('\n').filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);

/* ---------- session-type presets ---------- */
const TYPE_LABEL = { easy_run:'Easy Run', tempo_run:'Tempo Run', interval_run:'Intervals', long_run:'Long Run', strength:'Strength', cross_train:'Cross-Training', active_recovery:'Active Recovery', rest:'Rest Day' };
const PREP = {
  easy_run: ['2–3 min brisk walk into the run', 'Leg swings front-back + side-side — 10/leg', 'Walking lunge with reach — 6/leg'],
  tempo_run: ['5 min easy jog', 'Leg swings 10/leg + hip circles', 'A-skips 2×20m, high knees 2×20m', '3–4 strides before the first hard rep'],
  interval_run: ['5 min easy jog', 'Leg swings 10/leg + hip circles', 'A-skips 2×20m, high knees 2×20m', '4 strides building to ~90%'],
  long_run: ['Same as easy-run prep', 'Calf raises 2×15 + glute bridge 2×10 if it’s a morning run'],
  strength: ['3–5 min easy cardio', 'Bodyweight squat 2×10, glute bridge 2×10', "World's greatest stretch — 3/side", 'Light ramp-up sets of the first movement'],
  cross_train: ['5 min easy spin/row to warm up', 'Hip circles + arm circles — 8 each way'],
  active_recovery: ['Nothing formal — the session is the mobility work'],
  rest: ['Optional 10-min flow: hip flexors, figure-4, calves, thoracic — 60–90s each']
};
const FUEL = {
  quality: ['Pre (60+ min before): carb-forward, low fat/fiber — oats + banana + coffee', 'Post (within ~45 min): 20–40g protein + fast carbs', 'Carbs are the story today — don’t run this one empty'],
  easy: ['No special pre-fuel needed under 60 min', 'Protein at the next meal; normal eating day'],
  strength: ['Pre (1–2 h): balanced meal, protein + carbs', 'Post (within ~2 h): 30–40g protein; daily total matters most', 'Caffeine 30–45 min before if you use it'],
  rest: ['Carbs come down today, protein stays up', 'If weight loss is a goal, today is where the deficit lives', 'Anchor protein at every meal']
};
const fuelFor = t => (t === 'tempo_run' || t === 'interval_run' || t === 'long_run') ? FUEL.quality
  : t === 'strength' ? FUEL.strength
  : (t === 'rest' || t === 'active_recovery') ? FUEL.rest : FUEL.easy;
const fuelCat = t => (t === 'tempo_run' || t === 'interval_run') ? 'quality'
  : t === 'long_run' ? 'long' : t === 'strength' ? 'strength' : 'easy';

/* Per-day macro targets from the session-type energy model:
   kcal = tdee_baseline + session cost - deficit placement; protein constant,
   fat by day type, carbs = remainder. Falls back to the flat two-set targets.
   Once workouts sync with device active_kcal, actual burn replaces the planned
   session's estimate, and unplanned workouts add on top — so targets follow
   what you actually did. */
function dayMacros(s, date) {
  const T = PROFILE?.targets; if (!T) return null;
  const isRest = !s || s.type === 'rest' || s.type === 'active_recovery';
  const M = T.model;
  if (!M) return T[isRest ? 'macros_rest_day' : 'macros_training_day'] || null;
  const d = s?.date || date;
  const acts = d ? LOG.filter(e => e.kind === 'workout' && e.date === d && e.result !== 'skipped') : [];
  const extraCost = e => e.active_kcal ??
    (e.type === 'strength' ? (M.strength_kcal || 250)
     : e.type?.endsWith('_run') ? (M.kcal_per_mile?.[e.type] || 100) * (e.miles || 3)
     : (M.cross_train_kcal || 200));
  let cost = 0;
  if (!isRest) {
    const main = acts.find(e => e.planned !== false);
    if (main?.active_kcal) {
      cost = main.active_kcal;
    } else if (s.type.endsWith('_run')) {
      const mi = s.miles ?? (parseFloat((s.detail || '').match(/(\d+(?:\.\d+)?)\s*mi\b/)?.[1]) || 3);
      cost = (M.kcal_per_mile?.[s.type] || 100) * mi;
    } else if (s.type === 'strength') cost = M.strength_kcal || 250;
    else cost = M.cross_train_kcal || 200;
  }
  const extras = isRest ? acts : acts.filter(e => e.planned === false);
  cost += extras.reduce((a, e) => a + extraCost(e), 0);
  const deficit = isRest ? (M.deficit?.rest || 0) : ((M.key_types || []).includes(s.type) ? (M.deficit?.key || 0) : (M.deficit?.easy || 0));
  const kcal = Math.round(((T.tdee_baseline || 2200) + cost - deficit) / 10) * 10;
  const fat_g = isRest ? (M.fat_g?.rest ?? 75) : (M.fat_g?.training ?? 70);
  const protein_g = M.protein_g || 150;
  const carbs_g = Math.max(0, Math.round((kcal - protein_g * 4 - fat_g * 9) / 4));
  return { kcal, protein_g, carbs_g, fat_g };
}

function nutritionBlock(s, isRest) {
  const m = dayMacros(isRest ? null : s, todayStr());
  const tag = isRest || !s ? '' : (TYPE_LABEL[s.type] || s.type).toUpperCase();
  let html = `<div class="card"><h3>Today's Fuel${m && tag ? ` · <span class="daytag">${tag}</span>` : ''}</h3>`;
  if (m) {
    const t = todayStr();
    const eaten = LOG.filter(e => e.kind === 'nutrition' && e.date === t)
      .reduce((a, e) => ({ kcal: a.kcal + (e.kcal || 0), p: a.p + (e.protein_g || 0),
                           c: a.c + (e.carbs_g || 0), f: a.f + (e.fat_g || 0) }),
              { kcal: 0, p: 0, c: 0, f: 0 });
    const cell = (label, got, target, unit) => {
      const raw = target ? got / target * 100 : 0;
      const pct = Math.min(100, Math.round(raw));
      // blue = landed within 5% of target; red = blew past it by >10%
      const cls = raw > 110 ? 'over' : (raw >= 95 && raw <= 105 ? 'hit' : '');
      return `<div class="macro">
        <div class="mk">${label}</div>
        <div class="mv ${cls}">${Math.round(got)}</div>
        <div class="ml">of ${target}${unit}</div>
        <div class="mbar"><i class="${cls === 'over' ? 'over' : ''}" style="width:${pct}%"></i></div>
      </div>`;
    };
    html += `<div class="macrorow">
      ${cell('Calories', eaten.kcal, m.kcal, '')}
      ${cell('Protein', eaten.p, m.protein_g, 'g')}
      ${cell('Carbs', eaten.c, m.carbs_g, 'g')}
      ${cell('Fat', eaten.f, m.fat_g, 'g')}
    </div>`;
    const notes = LOG.filter(e => e.kind === 'coach_note' && e.topic === 'nutrition' && e.date === t);
    const note = notes[notes.length - 1];
    if (note?.text) {
      const lvl = note.level === 'watch' || note.level === 'flag' ? note.level : 'good';
      html += `<div class="cread ${lvl}">
        <div class="seclab">Coach's Read${lvl !== 'good' ? ` · ${lvl}` : ''}</div>
        <div class="sectxt">${esc(note.text)}</div>
      </div>`;
    } else if (!eaten.kcal) {
      html += `<p class="muted" style="margin-bottom:10px">Tell Coach what you eat ("ate eggs + rice, big bowl") — totals track here.</p>`;
    }
  }
  if (!isRest && s) {
    const cat = fuelCat(s.type);
    const hasFuel = PROFILE?.targets?.fuel?.pre?.[cat] || PROFILE?.targets?.fuel?.post?.[cat];
    if (!hasFuel) {
      html += `<ul class="plain">${fuelFor(s.type).map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
    }
  } else {
    html += `<ul class="plain">${FUEL.rest.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`;
  }
  if (!m) html += '<p class="muted" style="margin-top:8px">Complete onboarding with your coach to get exact macro numbers.</p>';
  return html + '</div>';
}

/* ---------- date helpers ---------- */
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = s => new Date(s + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const shortDate = s => new Date(s + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

/* ---------- state ---------- */
let PLAN = null, PROFILE = null, LOG = [], weekIdx = 0;

function allSessions() { return (PLAN?.weeks || []).flatMap(w => w.sessions.map(s => ({ ...s, week: w.week }))); }
function esc(t) { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; }

/* ---------- Daily Brief ---------- */
function renderBrief() {
  const el = $('view-brief');
  const t = todayStr();
  const s = allSessions().find(x => x.date === t);
  $('subtitle').textContent = 'Coach · ' + fmtDate(t);
  let html = '';
  if (!s) {
    html = '';

    const cat = fuelCat(s.type);

    const post = isRest ? null : PROFILE?.targets?.fuel?.post?.[cat];

    html += `<div class="card">
      <h3>Today's Session</h3>
      <div class="wk-title">${esc(label)}<span class="badge ${esc(s.status)}">${esc(s.status)}</span></div>
      ${s.duration_min ? `<div class="wk-meta">~${s.duration_min} min</div>` : ''}
      <div class="wk-detail">${esc(s.detail)}</div>
      ${pre ? `<div class="sec"><div class="seclab">Pre-Workout</div><div class="sectxt">${esc(pre)}</div></div>` : ''}
      ${prepList.length ? `<div class="sec"><div class="seclab">Movement Prep</div><ul class="plain">${prepList.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
      ${post ? `<div class="sec"><div class="seclab">Post-Workout</div><div class="sectxt">${esc(post)}</div></div>` : ''}
    </div>`;
    const os = PROFILE?.optional_strength;
    if (s.type.endsWith('_run') && os?.exercises?.length) {
      html += `<div class="card"><h3>Optional Strength${os.title ? ` · <span class="daytag">${esc(os.title).toUpperCase()}</span>` : ''}</h3>
        ${os.note ? `<p class="muted" style="margin-bottom:10px">${esc(os.note)}</p>` : ''}
        <ul class="plain">${os.exercises.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      </div>`;
    }
    html += nutritionBlock(s, isRest);
    if (s.status === 'upcoming') html += `<div class="card muted">Done? Tap the whistle and tell Coach how it went — completed, partial, or skipped.</div>`;
  }
  el.innerHTML = html;
}

/* ---------- Schedule ---------- */
const ST_ICON = { completed: '✓', partial: '◐', skipped: '✗' };
function renderSchedule() {
  const el = $('view-schedule');
  const weeks = PLAN?.weeks || [];
  if (!weeks.length) { el.innerHTML = '<div class="card muted">No plan yet — talk to your coach to build one.</div>'; return; }
  weekIdx = Math.min(weekIdx, weeks.length - 1);
  const w = weeks[weekIdx];
  const t = todayStr();
  const sessions = [...w.sessions].sort((a, b) => a.date.localeCompare(b.date));
  const nav = `<div class="wknav">
    <button id="wkPrev" ${weekIdx === 0 ? 'disabled' : ''}>‹</button>
    <span class="label">Week ${w.week}${w.phase ? ' · ' + esc(w.phase.replace('_', ' ')) : ''}</span>
    <button id="wkNext" ${weekIdx === weeks.length - 1 ? 'disabled' : ''}>›</button>
  </div>`;
  const miles = sessions.reduce((sum, s) => sum + (s.miles ?? (parseFloat((s.detail || '').match(/(\d+(?:\.\d+)?)\s*mi\b/)?.[1]) || 0)), 0);
  const nRuns = sessions.filter(s => s.type.endsWith('_run')).length;
  const nStr = sessions.filter(s => s.type === 'strength').length;
  const lo = sessions[0]?.date, hi = sessions[sessions.length - 1]?.date;
  const ranMiles = LOG.filter(e => e.kind === 'workout' && (e.result === 'completed' || e.result === 'partial'))
    .filter(e => { const d = e.session_date || e.date; return d >= lo && d <= hi; })
    .reduce((sum, e) => sum + (e.miles ?? (parseFloat((e.actual || '').match(/(\d+(?:\.\d+)?)\s*mi\b/)?.[1]) || 0)), 0);
  const fmtMi = v => (Math.round(v * 10) / 10) % 1 ? (Math.round(v * 10) / 10).toFixed(1) : Math.round(v * 10) / 10;
  const pct = miles ? Math.min(100, Math.round(ranMiles / miles * 100)) : 0;
  const summary = `<div class="wkintro">
    <div class="wksum">
      <div class="minum">${fmtMi(miles)}</div>
      <div class="milab">miles<br>planned</div>
      <div class="wkdiv"></div>
      <div class="minum ran">${fmtMi(ranMiles)}</div>
      <div class="milab">miles<br>ran</div>
    </div>
    <div class="wkbar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="counts">${nRuns + nStr} workouts · ${nRuns} runs · ${nStr} strength</div>
    ${w.summary || w.focus ? `<div class="wksum-text">${esc(w.summary || w.focus)}</div>` : ''}
  </div>`;
  const rows = sessions.map((s, i) => {
    const isRest = s.type === 'rest' || s.type === 'active_recovery';
    const dayNum = parseInt(s.date.slice(8, 10), 10);
    const dm = dayMacros(isRest ? null : s, s.date);
    return `
    <div class="card day-row day-card ${isRest ? 'dim' : ''} ${s.date === t ? 'today' : ''}" data-i="${i}">
      <div class="head">
        <div class="datechip"><span class="d1">${esc(s.day)}</span><span class="d2">${dayNum}</span></div>
        <div class="what">
          <div class="t">${esc(TYPE_LABEL[s.type] || s.type)}</div>
        </div>
        ${ST_ICON[s.status] ? `<div class="st ${esc(s.status)}" title="${esc(s.status)}">${ST_ICON[s.status]}</div>` : ''}
        <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
      <div class="full">
        <div class="inner">
          <div class="txt">${esc(s.detail)}</div>
          ${dm ? `<div class="dmacros">${dm.kcal} kcal · ${dm.protein_g}P · ${dm.carbs_g}C · ${dm.fat_g}F</div>` : ''}
          <div class="meta">${s.duration_min ? '~' + s.duration_min + ' min · ' : ''}${esc(s.status)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = nav + summary + rows;
  const prev = $('wkPrev'), next = $('wkNext');
  if (prev) prev.onclick = () => { weekIdx--; renderSchedule(); };
  if (next) next.onclick = () => { weekIdx++; renderSchedule(); };
  el.querySelectorAll('.day-row').forEach(r => r.onclick = () => r.classList.toggle('open'));
}

/* ---------- Progress ---------- */
function isoWeekKey(ds) {
  const d = new Date(ds + 'T12:00:00');
  const day = (d.getDay() + 6) % 7; // Mon=0
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10); // week's Monday
}
function renderProgress() {
  const el = $('view-progress');
  const t = todayStr();
  const workouts = LOG.filter(e => e.kind === 'workout');
  const done = workouts.filter(e => e.result === 'completed' || e.result === 'partial');
  const runMiles = e => e.miles ?? (parseFloat((e.actual || '').match(/(\d+(?:\.\d+)?)\s*mi\b/)?.[1]) || 0);
  const fmtMi = v => (Math.round(v * 10) / 10) % 1 ? (Math.round(v * 10) / 10).toFixed(1) : Math.round(v * 10) / 10;
  // week-to-date and month-to-date mileage
  const wk0 = isoWeekKey(t);
  const wtd = done.filter(e => isoWeekKey(e.session_date || e.date) === wk0).reduce((s, e) => s + runMiles(e), 0);
  const mtd = done.filter(e => (e.session_date || e.date).slice(0, 7) === t.slice(0, 7)).reduce((s, e) => s + runMiles(e), 0);
  // consistency: sessions completed vs planned, rolling 4 weeks
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 28);
  const cut = cutoff.toISOString().slice(0, 10);
  const planned28 = allSessions().filter(s => s.date >= cut && s.date <= t && s.type !== 'rest');
  const done28 = done.filter(e => { const d = e.session_date || e.date; return d >= cut && d <= t; });
  const consPct = planned28.length ? Math.min(100, Math.round(done28.length / planned28.length * 100)) : null;
  // weight: profile weigh-ins + logged weigh-ins
  const wis = [...(PROFILE?.stats?.weigh_ins || []), ...LOG.filter(e => e.kind === 'weigh_in')]
    .filter(w => w.kg).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const lb = kg => Math.round(kg * 2.20462 * 10) / 10;
  const wNow = wis.length ? lb(wis[wis.length - 1].kg) : null;
  const wDelta = wis.length > 1 ? Math.round((lb(wis[wis.length - 1].kg) - lb(wis[0].kg)) * 10) / 10 : null;
  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">Mileage WTD</div><div class="v">${fmtMi(wtd)}</div><div class="l">miles this week</div></div>
    <div class="tile"><div class="k">Mileage MTD</div><div class="v">${fmtMi(mtd)}</div><div class="l">miles this month</div></div>
    <div class="tile"><div class="k">Consistency</div><div class="v">${consPct == null ? '\u2013' : consPct + '<span style="font-size:1.2rem">%</span>'}</div><div class="l">${done28.length} of ${planned28.length} sessions \u00b7 4 wks</div></div>
    <div class="tile"><div class="k">Weight</div><div class="v">${wNow ?? '\u2013'}</div><div class="l">${wNow == null ? 'tell coach a weigh-in' : (wDelta == null ? 'lbs \u00b7 baseline set' : 'lbs \u00b7 ' + (wDelta > 0 ? '+' : '') + wDelta + ' since start')}</div></div>
  </div>`;
  // weekly mileage line chart, last 12 weeks
  const keys = []; { const d = new Date();
    for (let i = 11; i >= 0; i--) { const dd = new Date(d); dd.setDate(d.getDate() - i * 7); keys.push(isoWeekKey(dd.toISOString().slice(0, 10))); } }
  const milesByWk = {};
  for (const e of done) { const k = isoWeekKey(e.session_date || e.date); milesByWk[k] = (milesByWk[k] || 0) + runMiles(e); }
  // backfilled weekly totals (e.g. from Strava history) fill weeks with no logged runs
  for (const e of LOG.filter(e => e.kind === 'week_history')) {
    if (!milesByWk[e.week]) milesByWk[e.week] = e.miles || 0;
  }
  const vals = keys.map(k => Math.round((milesByWk[k] || 0) * 10) / 10);
  const yMax = Math.max(4, Math.ceil(Math.max(...vals, 1) / 4) * 4);
  const H = 170, PADT = 14, PADB = 22, plotH = H - PADT - PADB;
  const xPct = i => (i / (keys.length - 1)) * 100;
  const yPx = v => PADT + plotH * (1 - v / yMax);
  const linePts = vals.map((v, i) => `${xPct(i).toFixed(2)},${yPx(v).toFixed(1)}`).join(' ');
  const area = `M0,${yPx(vals[0]).toFixed(1)} ` + vals.map((v, i) => `L${xPct(i).toFixed(2)},${yPx(v).toFixed(1)}`).join(' ') + ` L100,${PADT + plotH} L0,${PADT + plotH} Z`;
  const grid = [yMax, yMax / 2].map(v => `
    <line x1="0" x2="100" y1="${yPx(v).toFixed(1)}" y2="${yPx(v).toFixed(1)}" stroke="rgba(241,244,246,.08)" vector-effect="non-scaling-stroke"/>`).join('');
  const ylabels = [yMax, yMax / 2, 0].map(v => `<span class="yl" style="top:${yPx(v).toFixed(1)}px">${v} mi</span>`).join('');
  const seen = new Set();
  const xlabels = keys.map((k, i) => {
    const dt = new Date(k + 'T12:00:00');
    if (dt.getDate() > 7) return '';
    const m = dt.toLocaleDateString(undefined, { month: 'short' });
    if (seen.has(m)) return '';
    seen.add(m);
    return `<span class="xl2" style="left:${xPct(i).toFixed(2)}%">${m}</span>`;
  }).join('');
  const dots = keys.map((k, i) => `
    <div class="dot" style="left:${xPct(i).toFixed(2)}%;top:${yPx(vals[i]).toFixed(1)}px"></div>`).join('');
  const chart = `<div class="card"><h3>Weekly Mileage \u00b7 12 wks</h3>
    <div class="lread"><span class="lrd"></span><span class="lrv"></span></div>
    <div class="lwrap">
      <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="mgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0aa2d6" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#0aa2d6" stop-opacity="0"/>
        </linearGradient></defs>
        ${grid}
        <path d="${area}" fill="url(#mgrad)"/>
        <polyline points="${linePts}" fill="none" stroke="var(--bar)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      </svg>
      <div class="lcursor" style="top:${PADT}px;height:${plotH}px"></div>
      ${ylabels}${xlabels}${dots}
    </div></div>`;
  const recent = [...workouts].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 6);
  const list = `<div class="card"><h3>Recent activity</h3>
    ${recent.length ? `<ul class="plain loglist">${recent.map(e => `
      <li><div class="row1"><span>${ST_ICON[e.result] || ''} ${esc(TYPE_LABEL[e.type] || e.type || 'workout')}</span><span class="dt">${shortDate(e.session_date || e.date)}</span></div>
      <div class="row2">${esc(e.actual || e.reason || e.note || e.result)}</div></li>`).join('')}</ul>`
    : '<p class="muted">Nothing logged yet. After your first workout, tell Coach how it went \u2014 it lands here.</p>'}</div>`;
  el.innerHTML = chart + tiles + list;
  // scrubber: tap/drag across the chart to read any week
  const wrap = el.querySelector('.lwrap');
  if (wrap) {
    const lrd = el.querySelector('.lrd'), lrv = el.querySelector('.lrv');
    const dotEls = [...wrap.querySelectorAll('.dot')];
    const cur = wrap.querySelector('.lcursor');
    const setIdx = i => {
      lrd.textContent = 'Week of ' + shortDate(keys[i]);
      lrv.innerHTML = `${fmtMi(vals[i])} <small>mi</small>`;
      dotEls.forEach((d, j) => d.classList.toggle('active', j === i));
      cur.style.left = xPct(i).toFixed(2) + '%';
      cur.style.display = 'block';
    };
    setIdx(keys.length - 1);
    const pick = ev => {
      const r = wrap.getBoundingClientRect();
      const frac = (ev.clientX - r.left) / r.width;
      setIdx(Math.max(0, Math.min(keys.length - 1, Math.round(frac * (keys.length - 1)))));
    };
    wrap.addEventListener('pointerdown', e => { e.preventDefault(); pick(e); });
    wrap.addEventListener('pointermove', e => { if (e.buttons) pick(e); });
  }
}

/* ---------- tabs / setup / boot ---------- */
const views = { brief: renderBrief, schedule: renderSchedule, progress: renderProgress };
const TITLES = { brief: 'Today', schedule: 'Schedule', progress: 'Progress' };
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('bigTitle').innerHTML = TITLES[b.dataset.tab] + '<span class="tick">.</span>';
  for (const v of ['brief', 'schedule', 'progress']) $('view-' + v).classList.toggle('hidden', v !== b.dataset.tab);
  $('view-setup').classList.add('hidden');
  views[b.dataset.tab]();
});
$('saveSetup').onclick = () => {
  const tok = $('tokenInput').value.trim(), br = $('branchInput').value.trim();
  tok ? localStorage.setItem(LS.token, tok) : localStorage.removeItem(LS.token);
  br ? localStorage.setItem(LS.branch, br) : localStorage.removeItem(LS.branch);
  location.reload();
};

async function boot() {
  let failures = 0;
  const grab = async (path, fallback) => { try { return await loadFile(path); } catch { failures++; return fallback; } };
  const [plan, profile, log, session] = await Promise.all([
    grab('coach-data/plan.json', null),
    grab('coach-data/profile.json', null),
    grab('coach-data/log.jsonl', ''),
    grab('coach-data/session.json', null),
  ]);
  try { PLAN = plan && JSON.parse(plan); } catch {}
  try { PROFILE = profile && JSON.parse(profile); } catch {}
  LOG = parseJSONL(log || '');
  try { const s = session && JSON.parse(session); if (s?.url) $('fab').href = s.url; } catch {}
  if (!PLAN && !PROFILE) {
    $('view-setup').classList.remove('hidden');
    $('setupErr').textContent = failures ? 'Could not reach the repo anonymously — it may be private.' : '';
  }
  // pick current week for schedule
  const t = todayStr();
  const weeks = PLAN?.weeks || [];
  const idx = weeks.findIndex(w => w.sessions.some(s => s.date >= t));
  weekIdx = idx >= 0 ? idx : Math.max(0, weeks.length - 1);
  renderBrief(); renderSchedule(); renderProgress();
}
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* pull-to-refresh: drag down from the top of the page to refetch coach-data */
{
  const ptr = $('ptr');
  const THRESH = 70;
  let startY = null, pulling = false, busy = false;
  document.addEventListener('touchstart', e => {
    pulling = window.scrollY <= 0 && !busy;
    startY = pulling ? e.touches[0].clientY : null;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pulling || startY == null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 8 && window.scrollY <= 0) {
      const d = Math.min(dy / 2, 96);
      ptr.style.transform = `translate(-50%, ${d}px)`;
      ptr.classList.add('show');
      ptr.classList.toggle('ready', d >= THRESH);
    } else {
      ptr.classList.remove('show', 'ready');
    }
  }, { passive: true });
  document.addEventListener('touchend', async () => {
    if (!pulling) return;
    const go = ptr.classList.contains('ready');
    pulling = false; startY = null;
    if (go && !busy) {
      busy = true;
      ptr.classList.add('spin');
      ptr.style.transform = `translate(-50%, ${THRESH}px)`;
      try { await boot(); } catch {}
      ptr.classList.remove('spin');
      busy = false;
    }
    ptr.classList.remove('show', 'ready');
    ptr.style.transform = '';
  });
}
</script>
